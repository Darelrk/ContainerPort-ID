<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ContainerPort-ID — Anomaly Early-Warning Layer</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f4f4ef;
      --color-ink:     #14233b;
      --color-muted:   #667286;
      --color-soft:    #8593a8;
      --color-accent:  #e85d4a;
      --font-sans:     'Space Grotesk', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 760px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Methodology · ContainerPort-ID</p>
    <h1>Anomaly early-warning — seasonal residuals, two detectors, one log</h1>

    <svg viewBox="0 0 920 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="canomaly-title canomaly-desc">
      <title id="canomaly-title">Anomaly early-warning flow</title>
      <desc id="canomaly-desc">Weekly port series are scored against the same-week-last-year value; residuals pass into a z-score detector and an Isolation Forest in parallel; flagged weeks collapse into an episode log that matches documented events such as COVID lockdowns and Lebaran shutdowns.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#667286"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e85d4a"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f4f4ef"/>

      <!-- ============ ARROWS ============ -->
      <!-- series -> baseline -->
      <line x1="460" y1="96" x2="460" y2="128" stroke="#667286" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- baseline -> residual -->
      <line x1="460" y1="184" x2="460" y2="216" stroke="#667286" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- residual -> zscore (up-left) and -> iforest (down-right): fan out -->
      <path d="M 452,280 H 296 Q 288,280 288,288 V 324" fill="none" stroke="#667286" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 468,280 H 624 Q 632,280 632,288 V 324" fill="none" stroke="#667286" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- zscore -> flag decision -->
      <line x1="288" y1="396" x2="288" y2="428" stroke="#667286" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- iforest -> flag decision -->
      <line x1="632" y1="396" x2="632" y2="428" stroke="#667286" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- OR merge dot -> episode log -->
      <!-- two decisions each NO->log; draw merge dot at center -->
      <path d="M 288,492 V 516 H 452" fill="none" stroke="#667286" stroke-width="1.2"/>
      <path d="M 632,492 V 516 H 468" fill="none" stroke="#667286" stroke-width="1.2"/>
      <circle cx="460" cy="516" r="4" fill="#14233b"/>
      <line x1="460" y1="516" x2="460" y2="540" stroke="#e85d4a" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- ============ NODES ============ -->
      <!-- series -->
      <rect x="356" y="64" width="208" height="32" rx="16" fill="#ffffff" stroke="#14233b" stroke-width="1"/>
      <text x="460" y="84" fill="#14233b" font-size="12" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">Weekly port series</text>

      <!-- baseline -->
      <rect x="340" y="128" width="240" height="56" rx="6" fill="#ffffff" stroke="#14233b" stroke-width="1"/>
      <rect x="348" y="134" width="88" height="12" rx="2" fill="transparent" stroke="rgba(20,35,59,0.40)" stroke-width="0.8"/>
      <text x="392" y="143" fill="rgba(20,35,59,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BASELINE</text>
      <text x="460" y="160" fill="#14233b" font-size="12" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">y(t − 52) same ISO week</text>
      <text x="460" y="176" fill="#667286" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">past actuals only — no leakage</text>

      <!-- residual -->
      <rect x="340" y="216" width="240" height="64" rx="6" fill="#ffffff" stroke="#14233b" stroke-width="1"/>
      <rect x="348" y="222" width="76" height="12" rx="2" fill="transparent" stroke="rgba(20,35,59,0.40)" stroke-width="0.8"/>
      <text x="386" y="231" fill="rgba(20,35,59,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESIDUAL</text>
      <text x="460" y="252" fill="#14233b" font-size="12" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">r(t) = y(t) − y(t−52)</text>
      <text x="460" y="268" fill="#667286" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pre-2022 refit for COVID segment</text>

      <!-- zscore -->
      <rect x="204" y="324" width="168" height="72" rx="6" fill="#ffffff" stroke="#14233b" stroke-width="1"/>
      <rect x="212" y="330" width="64" height="12" rx="2" fill="transparent" stroke="rgba(20,35,59,0.40)" stroke-width="0.8"/>
      <text x="244" y="339" fill="rgba(20,35,59,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">Z-SCORE</text>
      <text x="288" y="358" fill="#14233b" font-size="12" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">Statistical detector</text>
      <text x="288" y="374" fill="#667286" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">flag |z| &gt; 3.0</text>

      <!-- iforest -->
      <rect x="548" y="324" width="168" height="72" rx="6" fill="#ffffff" stroke="#14233b" stroke-width="1"/>
      <rect x="556" y="330" width="72" height="12" rx="2" fill="transparent" stroke="rgba(20,35,59,0.40)" stroke-width="0.8"/>
      <text x="592" y="339" fill="rgba(20,35,59,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">IFOREST</text>
      <text x="632" y="358" fill="#14233b" font-size="12" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">Isolation Forest</text>
      <text x="632" y="374" fill="#667286" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">contamination 2%</text>

      <!-- decisions -->
      <path d="M 288,428 L 368,460 L 288,492 L 208,460 Z" fill="#ffffff" stroke="#14233b" stroke-width="1"/>
      <text x="288" y="456" fill="#14233b" font-size="11" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">Flagged?</text>
      <text x="288" y="470" fill="#667286" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">z-test</text>

      <path d="M 632,428 L 712,460 L 632,492 L 552,460 Z" fill="#ffffff" stroke="#14233b" stroke-width="1"/>
      <text x="632" y="456" fill="#14233b" font-size="11" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">Flagged?</text>
      <text x="632" y="470" fill="#667286" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">iForest</text>

      <!-- episode log (focal) -->
      <rect x="356" y="540" width="208" height="60" rx="6" fill="rgba(232,93,74,0.08)" stroke="#e85d4a" stroke-width="1"/>
      <rect x="364" y="546" width="64" height="12" rx="2" fill="transparent" stroke="rgba(232,93,74,0.40)" stroke-width="0.8"/>
      <text x="396" y="555" fill="rgba(232,93,74,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOG</text>
      <text x="460" y="574" fill="#14233b" font-size="12" font-weight="600" font-family="'Space Grotesk', sans-serif" text-anchor="middle">Episode log</text>
      <text x="460" y="590" fill="#667286" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">60 episodes · top-10 ports</text>

      <!-- editorial callout -->
      <text x="748" y="560" fill="#14233b" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">caught: Delta '21,</text>
      <text x="748" y="578" fill="#14233b" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">PPKM, Lebaran '24,</text>
      <text x="748" y="596" fill="#14233b" font-size="14" font-family="'Instrument Serif', serif" font-style="italic">freight dip '23</text>

      <!-- ============ LEGEND ============ -->
      <line x1="30" y1="620" x2="890" y2="620" stroke="rgba(20,35,59,0.12)" stroke-width="0.8"/>
      <text x="30" y="636" fill="#667286" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="100" y="628" width="20" height="14" rx="7" fill="#ffffff" stroke="#14233b" stroke-width="0.8"/>
      <text x="128" y="638" fill="#667286" font-size="8" font-family="'Geist Mono', monospace">input series</text>
      <rect x="232" y="628" width="20" height="14" rx="3" fill="#ffffff" stroke="#14233b" stroke-width="0.8"/>
      <text x="260" y="638" fill="#667286" font-size="8" font-family="'Geist Mono', monospace">process step</text>
      <rect x="352" y="628" width="20" height="14" rx="3" fill="rgba(232,93,74,0.08)" stroke="#e85d4a" stroke-width="0.8"/>
      <text x="380" y="638" fill="#667286" font-size="8" font-family="'Geist Mono', monospace">output log (focal)</text>
      <circle cx="508" cy="635" r="4" fill="#14233b"/>
      <text x="520" y="638" fill="#667286" font-size="8" font-family="'Geist Mono', monospace">OR merge</text>
      <line x1="600" y1="635" x2="632" y2="635" stroke="#e85d4a" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="640" y="638" fill="#667286" font-size="8" font-family="'Geist Mono', monospace">flagged flow</text>
    </svg>
  </div>
</body>
</html>
